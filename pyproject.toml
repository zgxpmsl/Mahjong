[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mahjong-logger"
version = "0.1.0"
description = "GUI and pipelines for training Mahjong YOLO models with event logs"
readme = "README.md"
authors = [{name = "Mahjong Logger Team"}]
requires-python = ">=3.9"
dependencies = [
    "opencv-python",
    "PySide6",
    "ultralytics",
    "pyyaml",
]

[project.scripts]
mahjong-logger = "mahjong_logger.cli:main"
